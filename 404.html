<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sayfa bulunamadı — BeScript</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0047FF">
<meta name="apple-mobile-web-app-title" content="bescript">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--paper:#EDF0F4;--ink:#141F2A;--ink-soft:#3E4C5A;--line:#C6CDD6;--cobalt:#1746D1}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .box{max-width:480px;text-align:center}
  .code{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--cobalt);letter-spacing:.06em;margin-bottom:18px}
  h1{font-family:'Archivo',sans-serif;font-weight:850;font-variation-settings:'wdth' 118;font-size:clamp(30px,6vw,44px);letter-spacing:-.015em;line-height:1.08}
  p{margin-top:16px;color:var(--ink-soft);font-size:15px}
  .btn{display:inline-block;margin-top:28px;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;text-decoration:none;padding:10px 20px;border:1px solid var(--cobalt);color:var(--cobalt)}
  .btn:hover{background:var(--cobalt);color:#fff}
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>Bu sayfa yok.</h1>
    <p>Aradığın demo taşınmış ya da hiç var olmamış olabilir.</p>
    <a class="btn" href="/">Ana sayfaya dön →</a>
  </div>
</body>
</html>
